version: "2"
sql:
  - engine: "postgresql"
    schema: "../prisma/schema.prisma"
    queries: "sql/queries"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "text"
            go_type: "string"
