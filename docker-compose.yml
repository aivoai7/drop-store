services:
  db:
    image: postgres:16-alpine
    container_name: drop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drop}
      # Dev-only default. Override in .env for anything beyond local use.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drop}
      POSTGRES_DB: ${POSTGRES_DB:-drop_store}
    ports:
      - "5433:5432"
    volumes:
      - drop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drop} -d ${POSTGRES_DB:-drop_store}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    container_name: drop-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-drop}:${POSTGRES_PASSWORD:-drop}@db:5432/${POSTGRES_DB:-drop_store}
      GO_API_PORT: "8081"
      SITE_URL: ${SITE_URL:-http://localhost:3002}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
    ports:
      - "8081:8081"

  web:
    build: .
    container_name: drop-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-drop}:${POSTGRES_PASSWORD:-drop}@db:5432/${POSTGRES_DB:-drop_store}
      SITE_URL: ${SITE_URL:-http://localhost:3002}
      APP_SECRET: ${APP_SECRET:-}
      GATEWAY_ENC_KEY: ${GATEWAY_ENC_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-DROP <onboarding@resend.dev>}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-}
      SERVER_HOST_IP: ${SERVER_HOST_IP:-}
    ports:
      - "3002:3002"
    # Uploaded product images survive container rebuilds: this volume is the
    # photo store, mounted at the path the upload route writes to.
    volumes:
      - drop-uploads:/app/public/uploads

volumes:
  drop-db-data:
  drop-uploads:
